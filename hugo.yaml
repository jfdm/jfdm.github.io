markup:
  goldmark:
    renderer:
      unsafe: true
  katex:
    # Set to true to enable KaTeX processing on pages that have `math: true` in their front matter.
    enabled: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: nord
